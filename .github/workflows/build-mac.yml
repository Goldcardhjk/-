name: Build macOS App

# 触发方式：
#   1. 在 Actions 页面手动点 "Run workflow"（workflow_dispatch）
#   2. 推一个 v 开头的 tag，例如 git tag v0.70 && git push origin v0.70
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（写进 .app 和产物名，如 0.70）'
        required: false
        default: '0.70'
  push:
    tags:
      - 'v*'

# 创建 Release 需要写 contents 权限。默认的 GITHUB_TOKEN 在很多仓库里是
# 只读的，不声明就会报 "Resource not accessible by integration"。
permissions:
  contents: write

jobs:
  build:
    # 为什么两个架构都跑在 Intel runner 上（2026-11-18 实测结论）：
    #
    #   macOS arm64 托管 runner 容量极度紧张。macos-15 与 macos-26 的 arm64
    #   标准池连续五轮都拿不到机器，每轮排队约 15 分钟后以
    #   "The job was not acquired by Runner of type hosted" 失败，并伴随
    #   "Due to capacity constraints..." 提示。换镜像版本解决不了。
    #   （macos-14 / macos-13 已分别于 2026-11-02 及更早退役，不能再用。）
    #
    #   解法：改成在 Intel runner 上交叉构建 arm64。
    #   actions/setup-python 装的是 python.org 的 universal2 构建，二进制里
    #   同时含 x86_64 与 arm64 切片，PyInstaller 支持用 --target-arch 从
    #   universal2 环境里抽出指定架构的单架构应用（官方文档 macOS multi-arch
    #   support 一节明确支持 "single-arch application created using
    #   universal2 python"）。这样完全不依赖 arm64 托管机器。
    #
    # 两个架构都跑在 Intel runner 上：
    #   x86_64 —— 原生构建
    #   arm64  —— universal2 Python + --target-arch arm64 交叉构建
    # 这样彻底绕开 arm64 托管机器容量不足的问题（实测连续五轮拿不到机器）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: arm64

    runs-on: macos-15-intel
    name: build-${{ matrix.arch }}
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Python（universal2，含 arm64 切片）
        uses: actions/setup-python@v6
        with:
          # 必须用 python.org 的 universal2 构建：
          #   1. 自带 Tk 8.6（系统内置的 8.5 有渲染缺陷，圆角卡片和
          #      透明头像会出现锯齿黑边）
          #   2. 二进制里同时含 x86_64 与 arm64 切片，PyInstaller 才能
          #      用 --target-arch arm64 抽出 arm64 版本
          python-version: '3.12'
          architecture: 'x64'

      - name: 确认 Tk 版本与 Python 架构切片
        run: |
          set -e
          python -c "
          import tkinter, sys
          v = tkinter.TkVersion
          print('TkVersion =', v)
          print('TclVersion =', tkinter.TclVersion)
          if v < 8.6:
              sys.exit('Tk 版本过低（%s），界面渲染会出问题' % v)
          "
          echo '--- Python 可执行文件架构 ---'
          python -c "import sys; print(sys.executable)"
          lipo -archs "$(python -c 'import sys; print(sys.executable)')" || \
            file "$(python -c 'import sys; print(sys.executable)')"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow segno

      - name: 生成 .icns 应用图标
        run: |
          set -e
          mkdir -p build_mac/icon.iconset
          SRC="images/ui/app_icon_512.png"
          if [ ! -f "$SRC" ]; then SRC="images/ui/app_icon.png"; fi
          echo "图标源文件：$SRC"
          # iconutil 要求 iconset 里按固定命名提供各尺寸
          for s in 16 32 64 128 256 512; do
            sips -z $s $s     "$SRC" --out "build_mac/icon.iconset/icon_${s}x${s}.png"      >/dev/null
            d=$((s*2))
            sips -z $d $d     "$SRC" --out "build_mac/icon.iconset/icon_${s}x${s}@2x.png"   >/dev/null
          done
          iconutil -c icns build_mac/icon.iconset -o build_mac/app_icon.icns
          ls -la build_mac/app_icon.icns

      - name: 打包 .app
        env:
          JINBU_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -e
          echo "目标架构：$JINBU_TARGET_ARCH"
          pyinstaller --noconfirm --clean JinbuYihaoAgent_mac.spec
          ls -la dist/

      - name: 打包云端服务（命令行可执行）
        env:
          JINBU_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -e
          pyinstaller --noconfirm --clean JinbuYihaoCloudServer_mac.spec
          ls -la dist/JinbuYihaoCloudServer || true

      - name: 冒烟校验 .app 结构
        run: |
          set -e
          APP="dist/进步壹号.app"
          test -d "$APP" || { echo "没有产出 .app"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "缺 Info.plist"; exit 1; }
          BIN="$APP/Contents/MacOS/JinbuYihaoAgent"
          test -x "$BIN" || { echo "缺可执行文件"; exit 1; }
          echo "--- UI 资源是否随包 ---"
          find "$APP" -path "*images/ui/*" -name "*.png" | head -3
          echo "--- Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSHighResolutionCapable" "$APP/Contents/Info.plist"
          echo "--- 体积 ---"
          du -sh "$APP"

      - name: 校验产物架构与目标一致（交叉构建必查）
        run: |
          set -e
          BIN="dist/进步壹号.app/Contents/MacOS/JinbuYihaoAgent"
          echo "--- file ---"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "实际架构：$ARCHS"
          echo "期望架构：${{ matrix.arch }}"
          # 交叉构建最容易出的问题就是「以为出了 arm64，其实还是 x86_64」，
          # 这里不一致直接让构建失败，绝不把错架构的包发出去。
          case "$ARCHS" in
            *${{ matrix.arch }}*) echo "✓ 架构匹配" ;;
            *) echo "✗ 架构不匹配：拿到 $ARCHS，要的是 ${{ matrix.arch }}"; exit 1 ;;
          esac
          echo "--- 随包的 Python 动态库架构抽查 ---"
          find "dist/进步壹号.app" -name "*.so" -o -name "*.dylib" | head -5 | while read f; do
            printf '%-60s %s\n' "$(basename "$f")" "$(lipo -archs "$f" 2>/dev/null || echo '?')"
          done

      - name: 无界面环境下的导入冒烟
        # CI runner 没有登录态图形会话，不能真正弹窗，
        # 但可以确认所有模块在 macOS 上 import 得通、字体解析落到苹方。
        run: |
          python -c "
          import ui_base, images_util
          print('UI_FONT =', ui_base.UI_FONT)
          print('PIL 字体候选首项 =', images_util._FONT_CANDIDATES[0][0])
          import os
          ok = any(os.path.exists(p) for p, _ in images_util._FONT_CANDIDATES)
          print('存在可用中文字体文件:', ok)
          assert ok, 'macOS 上没有命中任何中文字体，卡片文字会变方块'
          import db, llm, scoring, points, payment, greetings, gifts
          import cloud_client, cloud_server, mcp_server
          print('全部业务模块导入通过')
          "

      - name: 临时签名（ad-hoc）
        # 不需要开发者账号。ad-hoc 签名能让 .app 在本机正常启动，
        # 但分发给别人时对方仍需右键「打开」绕过一次 Gatekeeper。
        # 要做到双击直接开，需要付费账号做 codesign + notarize。
        #
        # 注意：交叉构建出的 arm64 包在 Intel 机器上同样可以签名，
        # codesign 只改签名段，不执行代码，与当前机器架构无关。
        run: |
          set -e
          codesign --force --deep --sign - "dist/进步壹号.app"
          codesign --verify --verbose "dist/进步壹号.app" || true
          echo "--- 签名后架构复核（签名不应改变架构）---"
          lipo -archs "dist/进步壹号.app/Contents/MacOS/JinbuYihaoAgent"

      - name: 制作 DMG
        run: |
          set -e
          VER="${{ github.event.inputs.version || '0.70' }}"
          NAME="进步壹号_v${VER}_macOS_${{ matrix.arch }}"
          mkdir -p dmg_root
          cp -R "dist/进步壹号.app" dmg_root/
          ln -s /Applications dmg_root/Applications          # 拖拽安装的经典布局
          if [ -f dist/JinbuYihaoCloudServer ]; then
            mkdir -p dmg_root/云端服务
            cp dist/JinbuYihaoCloudServer dmg_root/云端服务/
          fi
          cp 打包说明_macOS.md dmg_root/使用说明.md 2>/dev/null || true
          hdiutil create -volname "进步壹号 v${VER}" \
                         -srcfolder dmg_root -ov -format UDZO \
                         "${NAME}.dmg"
          ls -lh "${NAME}.dmg"
          echo "DMG_NAME=${NAME}" >> $GITHUB_ENV

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}.dmg
          retention-days: 30

      - name: 打 tag 时自动发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}.dmg
          generate_release_notes: true
